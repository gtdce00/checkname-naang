<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fae">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เช็คชื่อ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>โปรแกรมเช็คชื่อ · บันทึกคะแนน · ตัดเกรด</title>
<style>
:root{--pri:#1f5fae;--pri2:#e8f0fb;--ok:#1e8e3e;--late:#e09a00;--leave:#2a7fd4;--abs:#d93025;--bd:#d7dde5;--bg:#f4f6f9;--tx:#1d2733;--mut:#6b7785}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","TH Sarabun New","Leelawadee UI","Tahoma",sans-serif;font-size:17px;color:var(--tx);background:var(--bg)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:21px;margin:0;font-weight:600}
header .sub{opacity:.9;font-size:15px}
header .sp{flex:1}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:13px 16px;font:inherit;font-size:17px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{padding:14px;max-width:1400px;margin:auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:20px;margin:0 0 10px}
.card h3{font-size:17px;margin:14px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media(max-width:850px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;font-size:15px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}
textarea{width:100%;min-height:60px}
button.b{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer}
button.b:hover{background:var(--pri2)}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.p:hover{background:#174c8c}
button.d{color:var(--abs)}
button.sm{padding:5px 10px;font-size:15px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center;font-size:16px}
th{background:#eef2f7;font-weight:600}
td.l,th.l{text-align:left}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:8px}
.tw table{border:0}
.tw thead th{position:sticky;top:0;z-index:2}
.tw thead tr:nth-child(2) th{top:var(--h1,38px)}
.tw td.stk,.tw th.stk{position:sticky;left:0;background:#fff;z-index:1}
.tw td.stk:first-child,.tw th.stk:first-child{width:34px;min-width:34px;max-width:34px;box-sizing:border-box;padding-left:2px;padding-right:2px}
.tw thead th.stk{z-index:3;background:#eef2f7}
.mut{color:var(--mut);font-size:15px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:14px;background:#eef2f7}
.tag.ok{background:#e3f4e8;color:var(--ok)}.tag.bad{background:#fde8e6;color:var(--abs)}.tag.warn{background:#fff4dc;color:#a46d00}
.sess{display:flex;flex-direction:column;gap:4px;max-height:65vh;overflow:auto}
.sess div{padding:7px 10px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:16px}
.sess{position:relative}
.sess div:hover{background:var(--pri2)}
.sess div.sel{border-color:var(--pri);background:var(--pri2)}
.sess div.today{box-shadow:inset 4px 0 0 var(--late)}
.sess div.cx{opacity:.55;text-decoration:line-through}
.att{display:flex;gap:4px;justify-content:center}
.att{gap:6px!important}.att button{font:inherit;width:62px;padding:9px 0;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer;font-size:16px}
.att button.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.att button.L.on{background:var(--late);color:#fff;border-color:var(--late)}
.att button.S.on{background:var(--leave);color:#fff;border-color:var(--leave)}
.att button.A.on{background:var(--abs);color:#fff;border-color:var(--abs)}
.cP{color:var(--ok);font-weight:600}.cL{color:var(--late);font-weight:600}.cS{color:var(--leave);font-weight:600}.cA{color:var(--abs);font-weight:600}
td input.sc{width:50px;text-align:center;padding:5px 2px;font-size:16px}
#scTbl td,#scTbl th{padding:3px 4px}
th.vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:14px;min-height:90px;padding:6px 2px}
.wsbox{background:#fff8e6;border:1px solid #f1d58a;border-radius:8px;padding:8px 12px;margin:8px 0}
td input.sc.err{border-color:var(--abs);background:#fde8e6}
.tt td{min-width:110px}.tt select{width:100%;font-size:15px;padding:4px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{background:var(--pri2);border-radius:8px;padding:8px 14px;min-width:110px}
.kpi b{display:block;font-size:22px;color:var(--pri)}
.toast{position:fixed;bottom:18px;right:18px;background:#263238;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.inact{opacity:.5}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subnav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
nav .ic{margin-right:4px}
.mobonly{display:none}
@media(max-width:700px){
 body{font-size:16px}
 header{padding:8px 10px;gap:6px}header h1{font-size:16px}header .sub{font-size:12px}#hdrBackup{display:none}
 header .sp{display:none}#hdrBtns{width:100%;display:flex;gap:6px}#hdrBtns button{flex:1;font-size:14px;padding:6px}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;padding:0;border-top:1px solid var(--bd);border-bottom:0;justify-content:space-around;gap:0;box-shadow:0 -2px 8px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
 nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 2px 7px;font-size:11px;border-bottom:0;border-top:3px solid transparent;min-width:0}
 nav button.on{border-top-color:var(--pri)} nav .ic{font-size:21px;margin:0}
 main{padding:8px 8px 84px}
 .card{padding:10px;border-radius:8px;margin-bottom:10px;overflow-x:auto}.card h2{font-size:17px}
 .mobonly{display:block}.deskonly{display:none!important}.hm{display:none}
 th,td{font-size:15px;padding:5px 4px}
 .att{gap:4px!important}.att button{width:46px;padding:11px 0;font-size:15px}
 label.f{font-size:14px} input,select,textarea{font-size:16px}
 .kpi div{min-width:0;flex:1 1 40%}
 .toast{bottom:84px;left:12px;right:12px;text-align:center}
 .tw{max-height:none}
 .wsbox .row{flex-direction:column;align-items:stretch}
 .g2{grid-template-columns:1fr!important} .g2 input,.g2 select{width:100%}
}
@media print{header,nav,.noprint,button{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}.tw{max-height:none;overflow:visible;border:0}body{background:#fff}th,td{font-size:12px}}
</style>
</head>

<header>
  <div><h1>📘 โปรแกรมเช็คชื่อ · บันทึกคะแนน · ตัดเกรด</h1><div class="sub" id="hdrSub"></div></div>
  <div class="sp"></div>
  <div class="sub" id="hdrBackup"></div>
  <span id="hdrBtns"></span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileJSON" accept=".json" style="display:none" onchange="restoreJSON(this)">

function holidayName(d){for(const h of S.cal.holidays){if(!h.date)continue;const to=h.to||h.date;if(d>=h.date&&d<=to)return h.name||'วันหยุด';}return null;}
function sessionsOf(cid){
  const out=[];if(!S.cal.start||!S.cal.end)return out;
  const slots=Object.entries(S.tt).filter(([k,v])=>v===cid).map(([k])=>k.split('-').map(Number));
  for(let dt=pd(S.cal.start);dt<=pd(S.cal.end);dt.setUTCDate(dt.getUTCDate()+1)){
    const d=fd(dt),w=dt.getUTCDay();
    if(w===0||(w===6&&!S.cal.sat))continue;
    if(holidayName(d))continue;
    for(const[dw,p]of slots)if(dw===w){const key=cid+'|'+d+'|'+p;out.push({key,date:d,p,type:'s',cx:S.cancel[key]||null});}
  }
  for(const e of S.extra)if(e.c===cid){const key=cid+'|'+e.d+'|'+e.p;if(!out.find(x=>x.key===key))out.push({key,date:e.d,p:e.p,type:'x',note:e.note});}
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.p-b.p);
  return out;
}

function fillTopic(k){const r=S.sess[k];if(r&&!r.topic){const[c,d]=k.split('|');const p=plannedOf(c,d);if(p)r.topic=p.t;}}
function isDone(k){const r=S.sess[k];return r&&r.att&&Object.keys(r.att).length>0;}
function attStats(c){
  const ss=sessionsOf(c.id).filter(s=>!s.cx&&isDone(s.key));
  const studs=studentsOf(c,true),res={};
  for(const st of studs){const o={P:0,L:0,S:0,A:0,n:0};
    for(const s of ss){const v=S.sess[s.key].att[st.id];if(v){o[v]++;o.n++;}}
    const pres=o.P+(S.rules.lateAsPresent?o.L:0)+(S.rules.leaveAsPresent?o.S:0);
    o.pct=o.n?pres/o.n*100:null;res[st.id]=o;}
  return {sessions:ss,res};
}

function scoreOf(c,it,st){return S.scores[c.id]?.[it]?.[st];}
function calc(c,st){
  let total=0,missing=0;const comps=[];
  for(const cp of c.comps){let sum=0,mx=0;
    for(const it of cp.items){const v=scoreOf(c,it.id,st);mx+=+it.max||0;if(v===undefined||v===''||v===null)missing++;else sum+=+v;}
    const sc=mx?sum/mx*(+cp.full||0):0;comps.push(r1(sc));total+=sc;}
  return {comps,total:r1(total),missing};
}

function vGrade(){

  const dist=new Map();[...sc.rows].sort((a,b)=>b.min-a.min).forEach(r=>dist.set(r.g,0));let ms=0,rr=0;
  const rows=st.map((x,i)=>{const k=calc(c,x.id),g=gradeOf(c,k.total),o=res[x.id];
    let status='';if(o.pct!=null&&o.pct<S.rules.minPct){status='มส.';ms++;}else if(S.rules.markIncomplete&&k.missing){status='ร';rr++;}

function calGrid(){

  const s=pd(S.cal.start),e=pd(S.cal.end);let m=new Date(Date.UTC(s.getUTCFullYear(),s.getUTCMonth(),1));
  while(m<=e){const y=m.getUTCFullYear(),mo=m.getUTCMonth();let t=`<table style="width:auto;font-size:12px"><tr><th colspan="7">${TM[mo]} ${y+543}</th></tr><tr>${DAYS_S.map(d=>`<th style="font-size:11px">${d}</th>`).join('')}</tr><tr>`;
    const first=new Date(Date.UTC(y,mo,1)).getUTCDay();for(let i=0;i<first;i++)t+='<td></td>';
    const nd=new Date(Date.UTC(y,mo+1,0)).getUTCDate();

function toggleCourse(name,classId,on){

    if(used&&!confirm('วิชานี้มีข้อมูลแล้ว ลบหรือไม่?')){vSetup();return;}
    S.courses=S.courses.filter(x=>x!==c);Object.keys(S.tt).forEach(k=>{if(S.tt[k]===c.id)delete S.tt[k];});}

/* ---------- TIMETABLE EXCEL ---------- */
const DAY_RE=[[1,/จันทร์/],[2,/อังคาร/],[3,/พุธ/],[4,/พฤหัส/],[5,/ศุกร์/],[6,/เสาร์/]];
function normClass(t){const m=String(t).match(/(อ|อนุบาล|ป|ประถม(?:ศึกษา)?(?:ปีที่)?|ม|มัธยม(?:ศึกษา)?(?:ปีที่)?)\s*\.?\s*(\d)/);if(!m)return null;
  const p=m[1][0]==='อ'?'อ':m[1][0]==='ป'?'ป':'ม';return {cls:p+'.'+m[2],raw:m[0]};}
function parseTTSheet(rows){
  let hr=-1,pcol={};
  for(let i=0;i<Math.min(rows.length,30);i++){const m={};rows[i].forEach((v,j)=>{const s=String(v).trim();if(/^\d{1,2}$/.test(s)&&+s>=1&&+s<=12)m[j]=+s;});if(Object.keys(m).length>=3){hr=i;pcol=m;break;}}
  if(hr<0)throw new Error('ไม่พบแถวหัวตารางที่มีเลขคาบ 1, 2, 3, …');
  const times={};for(let i=hr+1;i<=hr+2&&i<rows.length;i++)for(const j in pcol){const s=String(rows[i][j]||'').trim();if(/\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}/.test(s))times[pcol[j]]=s.replace(/\s+/g,'');}
  const cells={};let day=0,teacher='';
  for(let i=0;i<rows.length;i++){const r=rows[i];
    for(const v of r){const s=String(v).trim();const m=s.match(/^ครู\s*([^\d]{3,40})$/);if(m&&!teacher)teacher=m[1].trim();}
    if(i<=hr)continue;
    let found=0;for(let j=0;j<r.length;j++){if(pcol[j]!==undefined)continue;const s=String(r[j]).trim();if(!s)continue;for(const[d,re]of DAY_RE)if(re.test(s)&&s.length<20){found=d;break;}if(found)break;}
    if(found)day=found;else if(r.some((v,j)=>pcol[j]===undefined&&/รวม|หมายเหตุ|ลงชื่อ/.test(String(v))))day=0;
    if(!day)continue;
    for(const j in pcol){const s=String(r[j]??'').trim();if(!s)continue;const k=day+'-'+pcol[j];cells[k]=(cells[k]?cells[k]+' ':'')+s;}}
  const slots=[],skipped=[];
  for(const k in cells){const t=cells[k].replace(/\s+/g,' ').trim();const c=normClass(t);
    if(!c){if(!/พัก|กลางวัน|ประชุม|PLC/i.test(t))skipped.push(t);continue;}
    let sub=t.replace(c.raw,' ').replace(/ชั้น/g,' ').replace(/\s+/g,' ').replace(/^[\s\-–,/]+|[\s\-–,/]+$/g,'').trim();
    if(!sub){skipped.push(t);continue;}
    const[d,p]=k.split('-').map(Number);slots.push({d,p,sub,cls:c.cls});}
  return {slots,times,periods:Object.values(pcol),teacher,skipped};
}
function importTT(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
  const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
  const sn=wb.SheetNames.find(n=>/ตารางสอน/.test(n)&&!/ตัวอย่าง/.test(n))||wb.SheetNames[0];
  const res=parseTTSheet(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false}));
  if(!res.slots.length)throw new Error('ไม่พบช่องที่มี “ชื่อวิชา + ชั้น” เช่น “คอมพิวเตอร์ ป.4”');
  if(Object.keys(S.tt).length&&!confirm('แทนที่ตารางสอนเดิมด้วยตารางจากไฟล์นี้?')){inp.value='';return;}
  const pn=[...new Set(res.periods)].sort((a,b)=>a-b);
  S.periods=pn.map(n=>({no:n,t:res.times[n]||(S.periods.find(p=>p.no===n)?.t||'')}));
  if(res.slots.some(s=>s.d===6))S.cal.sat=true;
  const newCls=[];S.tt={};
  for(const s of res.slots){let k=S.classes.find(c=>c.name===s.cls);if(!k){k={id:uid(),name:s.cls,students:[]};S.classes.push(k);newCls.push(s.cls);}
    let c=S.courses.find(x=>x.name===s.sub&&x.classId===k.id);if(!c)c=newCourse(S,s.sub,k.id);S.tt[s.d+'-'+s.p]=c.id;}
  if(res.teacher&&!S.info.teacher)S.info.teacher=res.teacher;
  sortCourses(S);attachPlans(S);saveNow();
  const n=new Set(Object.values(S.tt)).size;
  alert(`นำเข้าตารางสอนแล้ว ✓\n${res.slots.length} คาบ/สัปดาห์ · ${n} รายวิชา`+(newCls.length?`\n\nชั้นที่ยังไม่มีรายชื่อนักเรียน: ${[...new Set(newCls)].join(', ')} (เพิ่มรายชื่อได้ที่ ⚙️ ตั้งค่า › รายชื่อนักเรียน)`:'')+(res.skipped.length?`\n\nช่องที่อ่านไม่ได้ (ไม่มีชั้นเรียน): ${res.skipped.slice(0,8).join(' | ')}`:''));
  if(!S.setupDone){UI.step=3;vSetup();}else render();
  }catch(e){alert('นำเข้าตารางสอนไม่ได้: '+e.message);}inp.value='';};r.readAsArrayBuffer(f);}

function mergeClass(name,list){let k=S.classes.find(c=>c.name===name);let created=false;
  if(!k){k={id:uid(),name,students:[]};S.classes.push(k);created=true;}
  const seen=new Set();let add=0;for(const s of list){let m=k.students.find(x=>(s.code&&x.code===s.code)||x.name===s.name);if(m){m.name=s.name;m.code=s.code||m.code;m.active=s.active!==false;}else{m={id:uid(),code:s.code||'',name:s.name,active:s.active!==false};k.students.push(m);add++;}seen.add(m.id);}
  let off=0;k.students.forEach(x=>{if(!seen.has(x.id)&&x.active){x.active=false;off++;}});
  const idx=x=>{const i=list.findIndex(y=>(y.code&&y.code===x.code)||y.name===x.name);return i<0?1e6:i;};k.students.sort((a,b)=>idx(a)-idx(b));
  return `${name}: ${list.length} คน (ใหม่ ${add}${off?', ย้าย/ออก '+off:''})${created?' [ชั้นใหม่]':''}`;}
function exportSchool(){const d={type:'oa-school',ver:1,exported:new Date().toISOString(),info:{school:S.info.school,year:S.info.year,term:S.info.term},cal:S.cal,periods:S.periods,scales:S.scales,rules:S.rules,
  classes:S.classes.map(k=>({name:k.name,students:k.students.map(s=>({code:s.code,name:s.name,active:s.active}))}))};
  dl(`ข้อมูลโรงเรียน_${S.info.term}-${S.info.year}_${today()}.json`,new Blob([JSON.stringify(d)],{type:'application/json'}));}
function importSchool(d){try{localStorage.setItem('oa-school',JSON.stringify(d));}catch(e){}if(!confirm('อัปเดตรายชื่อนักเรียน ปฏิทิน วันหยุด เวลาคาบ และเกณฑ์ จากไฟล์ข้อมูลโรงเรียน?\n(ตารางสอน วิชา การเช็คชื่อ และคะแนนของคุณจะไม่ถูกลบ)'))return;
  const log=d.classes.map(k=>mergeClass(k.name,k.students));
  const termChanged=d.info.term!==S.info.term||d.info.year!==S.info.year;
  Object.assign(S.info,{school:d.info.school,year:d.info.year,term:d.info.term});S.cal=d.cal;
  if(d.periods&&d.periods.length)S.periods=d.periods;if(d.rules)S.rules=d.rules;
  for(const sc of d.scales||[]){const i=S.scales.findIndex(x=>x.id===sc.id);if(i>=0)S.scales[i]=sc;else S.scales.push(sc);}
  saveNow();render();alert('อัปเดตข้อมูลโรงเรียนแล้ว\n'+log.join('\n')+(termChanged?'\n\n⚠️ ภาคเรียน/ปีการศึกษาเปลี่ยน — ถ้าเริ่มภาคเรียนใหม่ ให้กด “เริ่มภาคเรียนใหม่” เพื่อล้างคะแนนเก่า':''));}

function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function backupJSON(){S.lastBackup=new Date().toISOString();save();dl(`สำรองข้อมูลเช็คชื่อ_${(S.info.teacher||'ครู').replace(/[\\/:*?"<>|\s]/g,'')}_${S.info.term}-${S.info.year}_${today()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));render();}
function restoreJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{inp.value='';let d;try{d=JSON.parse(r.result);}catch(e){return alert('ไฟล์ไม่ถูกต้อง');}
  if(d.type==='oa-school'){if(!S)return alert('กรุณาเข้าใช้งานครูก่อน แล้วนำเข้าข้อมูลโรงเรียนที่ ⚙️ ตั้งค่า › สำรอง / นำเข้า');return importSchool(d);}
  if(!d.classes||!d.courses)return alert('ไฟล์ไม่ถูกต้อง');
  if(!S||UI.restoreNew){UI.restoreNew=0;return addProfile(d.info?.teacher||'ครู',d);}
  if(!confirm(`แทนที่ข้อมูลของ “${S.info.teacher}” ด้วยไฟล์สำรองนี้${d.info?.teacher&&d.info.teacher!==S.info.teacher?' (ไฟล์เป็นของ '+d.info.teacher+')':''}?`))return;
  S=fixData(d);saveNow();render();toast('กู้คืนข้อมูลแล้ว');};r.readAsText(f);}
function importXLSX(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
  const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});let log=[];
  for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    let hr=-1,nc=-1,cc=-1;for(let i=0;i<Math.min(rows.length,15);i++){const j=rows[i].findIndex(v=>/ชื่อ/.test(String(v))&&!/รายชื่อ/.test(String(v)));if(j>=0){hr=i;nc=j;cc=rows[i].findIndex(v=>/รหัส/.test(String(v)));break;}}
    if(hr<0)continue;const list=[];for(let i=hr+1;i<rows.length;i++){const n=String(rows[i][nc]||'').replace(/\s+/g,' ').trim();if(!n)continue;list.push({code:cc>=0?String(rows[i][cc]).trim():'',name:n});}
    if(!list.length)continue;let k=S.classes.find(c=>c.name===sn.trim());
    if(!k){if(!confirm(`พบชีต “${sn}” (${list.length} คน) ซึ่งยังไม่มีในโปรแกรม — เพิ่มเป็นชั้นใหม่?`))continue;k={id:uid(),name:sn.trim(),students:[]};S.classes.push(k);}
    log.push(mergeClass(k.name,list));}
  save();render();alert(log.length?'นำเข้าแล้ว\n'+log.join('\n'):'ไม่พบรายชื่อในไฟล์');}catch(e){alert('อ่านไฟล์ไม่ได้: '+e.message);}inp.value='';};r.readAsArrayBuffer(f);}
function sheetsFor(c){
  const st=studentsOf(c,true),{sessions,res}=attStats(c),out={};
  const head=[[`${S.info.school} ภาคเรียนที่ ${S.info.term}/${S.info.year}`],[cName(c)+(S.info.teacher?' ครูผู้สอน '+S.info.teacher:'')],[]];
  // attendance
  let a=[...head,['ที่','รหัส','ชื่อ-สกุล',...sessions.map(s=>thDate(s.date)+' ค'+s.p),'มา','สาย','ลา','ขาด','%','ผล']];
  st.forEach((x,i)=>{const o=res[x.id];a.push([i+1,x.code,x.name+(x.active?'':' (ย้าย)'),...sessions.map(s=>({P:'/',L:'ส',S:'ล',A:'ข'}[S.sess[s.key].att[x.id]]||'')),o.P,o.L,o.S,o.A,o.pct==null?'':r1(o.pct),o.pct==null?'':o.pct>=S.rules.minPct?'ผ่าน':'มส.']);});
  out['เวลาเรียน']=a;
  // scores
  const items=c.comps.flatMap(cp=>cp.items);
  let sc=[...head,['ที่','รหัส','ชื่อ-สกุล',...c.comps.flatMap(cp=>[...cp.items.map(it=>`${it.name} (${it.max})`),`รวม${cp.name} (${cp.full})`]),`รวม (${fullOf(c)})`,'เวลาเรียน %','ผลการเรียน']];
  st.forEach((x,i)=>{const k=calc(c,x.id),o=res[x.id];let stt='';if(o.pct!=null&&o.pct<S.rules.minPct)stt='มส.';else if(S.rules.markIncomplete&&k.missing)stt='ร';
    sc.push([i+1,x.code,x.name+(x.active?'':' (ย้าย)'),...c.comps.flatMap((cp,j)=>[...cp.items.map(it=>scoreOf(c,it.id,x.id)??''),k.comps[j]]),k.total,o.pct==null?'':r1(o.pct),stt||gradeOf(c,k.total)]);});
  out['คะแนนและเกรด']=sc;
  let lg=[...head,['ครั้งที่','วันที่','คาบ','ตามกำหนดการสอน','ตัวชี้วัด','เรื่องที่สอนจริง','บันทึกหลังสอน','มาเรียน']];
  sessionsOf(c.id).forEach((s,i)=>{const r=S.sess[s.key]||{},v=Object.values(r.att||{});const pl=plannedOf(c.id,s.date);lg.push([i+1,thDate(s.date,1),s.p,pl?pl.u+' : '+pl.t:'',pl?pl.i:'',s.cx?'งดสอน: '+s.cx:topicOf(s.key),r.note||'',v.length?v.filter(z=>z==='P'||z==='L').length+'/'+v.length:'']);});
  out['บันทึกการสอน']=lg;
  out['ชิ้นงาน']=[...head,['ส่วนคะแนน','ชิ้นงาน','คะแนนเต็ม','เรื่อง/ตัวชี้วัด'],...c.comps.flatMap(cp=>cp.items.map(it=>[cp.name,it.name,it.max,it.topic||'']))];
  return out;
}
